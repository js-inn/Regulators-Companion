name: Run Python Ledger Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Python Ledger & Parser Scripts
      run: |
        echo "Running cloud execution pipeline..."
        # Add your main script execution command here if applicable:
        # python main.py
        python3 -c "print('Cloud runner environment active and parsing successfully!')"
