name: ILP Royalty & Settlement Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-and-settle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Seed Edge Custodian Node
        run: |
          python edge_agent_node.py

      - name: Execute Deterministic Royalty Engine
        run: |
          python royalty_stream_engine.py

      - name: Generate & Verify ISO 20022 Wire Simulation
        run: |
          python simulate_iso20022_secure.py

      - name: Package Audit Artifacts
        run: |
          mkdir -p settlement_output
          cp local_custodian.db settlement_output/
          cp wire_audit.db settlement_output/ 2>/dev/null || true
          cp simulated_wire_*.xml settlement_output/ 2>/dev/null || true
          echo "Settlement and ISO 20022 Payloads Verified and Signed via HMAC/SHA-256 on $(date -u)" > settlement_output/verification_manifest.txt

      - name: Upload Settlement & Wire Evidence Bundle
        uses: actions/upload-artifact@v4
        with:
          name: royalty-and-wire-evidence-${{ github.sha }}
          path: settlement_output/
